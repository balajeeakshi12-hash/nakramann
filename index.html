<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You ❤️</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
  }
  canvas {
    width: 100vw;
    height: 100vh;
    display: block;
  }
  .message {
    position: fixed;
    bottom: 25px;
    left: 0;
    right: 0;
    text-align: center;
    color: #ffb6c1;
    font-size: 13px;
    opacity: 0.7;
    letter-spacing: 1px;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="heart"></canvas>
<div class="message">for you, always ❤️</div>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener("resize", resize);

const text = "I love you";
const points = [];
const rings = [];

for (let scale = 11; scale <= 16; scale++) {
  const ring = [];
  for (let i = 0; i < 120; i++) {
    const angle = i * Math.PI * 2 / 120;
    ring.push({
      x: 16 * Math.pow(Math.sin(angle), 3) * scale,
      y: (13 * Math.cos(angle) - 5 * Math.cos(2 * angle)
         - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)) * scale
    });
  }
  rings.push(ring);
}

let frame = 0;

function draw() {
  frame++;
  ctx.fillStyle = "rgba(0,0,0,0.22)";
  ctx.fillRect(0, 0, innerWidth, innerHeight);

  const baseScale = Math.min(innerWidth / 650, innerHeight / 600);
  const pulse = 1 + Math.sin(frame * 0.045) * 0.035;
  const totalScale = baseScale * pulse;

  ctx.save();
  ctx.translate(innerWidth / 2, innerHeight / 2 - 10);
  ctx.scale(totalScale, totalScale);

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "bold 8px Arial";

  rings.forEach((ring, r) => {
    ring.forEach((p, i) => {
      const drift = Math.sin(frame * 0.025 + i * 0.08 + r) * 0.7;
      const alpha = 0.45 + 0.55 * Math.sin(frame * 0.03 + i * 0.12 + r) ** 2;

      ctx.shadowBlur = 7;
      ctx.shadowColor = "#ffb6c1";
      ctx.fillStyle = `rgba(255,182,193,${alpha})`;

      ctx.save();
      ctx.translate(p.x, -p.y + drift);
      ctx.rotate(Math.sin(i * 0.1 + frame * 0.01) * 0.08);
      ctx.fillText(text, 0, 0);
      ctx.restore();
    });
  });

  ctx.restore();
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
